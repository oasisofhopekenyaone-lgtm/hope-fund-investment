<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hope Fund Admin</title><style>body{font:16px system-ui;background:#f3f6f4;color:#17372a;padding:20px}.wrap{max-width:1000px;margin:auto;background:white;padding:20px;border-radius:14px}input,button{padding:10px;font:inherit;margin:5px;border-radius:8px}button{background:#16804e;color:white;border:0;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left;word-break:break-word}#out{white-space:pre-wrap;color:#a00}</style><div class="wrap"><h1>Hope Fund Investment — Admin Deposits</h1><h2>Administrator: Elias Wandimi Mathenge</h2><p>Enter admin password to view deposits and review pending receipts.</p><input id="pw" type="password" placeholder="Admin password"><button onclick="load()">Load deposits</button><p id="out"></p><table><thead><tr><th>ID</th><th>Receipt</th><th>Amount</th><th>Account</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><script>
async function load(){let p=document.querySelector('#pw').value,o=document.querySelector('#out'),tb=document.querySelector('#rows');o.textContent='Loading…';tb.innerHTML='';try{let r=await fetch('/api/admin/deposits',{headers:{'x-admin-password':p}});if(!r.ok){o.textContent=r.status===401?'Incorrect password.':'Unable to load deposits.';return}let data=await r.json();o.textContent=`${data.length} records`;for(let d of data){let tr=document.createElement('tr');for(let val of [d.id,d.receipt,Number(d.amount).toLocaleString('en-KE',{style:'currency',currency:'KES'}),d.account_ref,d.phone||'',d.status]){let td=document.createElement('td');td.textContent=val;tr.appendChild(td)}let actions=document.createElement('td');if(d.status==='PENDING'){for(let action of ['verify','reject']){let b=document.createElement('button');b.textContent=action;b.onclick=()=>act(d.id,action,p);actions.appendChild(b)}}tr.appendChild(actions);tb.appendChild(tr)}}catch(e){o.textContent='Connection error'}}
async function act(id,a,p){if(!confirm(`${a} deposit #${id}?`))return;let r=await fetch(`/api/admin/deposits/${id}/${a}`,{method:'POST',headers:{'x-admin-password':p}});if(r.ok)load();else alert('Action failed')}
</script></html>
